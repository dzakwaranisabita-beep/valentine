<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>happy valentine adekkk</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:0;overflow:hidden;font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#ff758c,#ff7eb3);display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:white;padding:40px;border-radius:25px;text-align:center;box-shadow:0 15px 35px rgba(0,0,0,.3);max-width:420px;position:relative;z-index:5;animation:fadeIn 1.5s}
.card img{width:120px;height:120px;border-radius:50%;object-fit:cover;margin:6px}
h1{color:#ff4d6d}
p{color:#555;font-size:16px}
button{margin-top:15px;padding:10px 25px;border:none;border-radius:30px;background:#ff4d6d;color:white;font-size:16px;cursor:pointer;transition:.3s}
button:hover{background:#e60039}
.heart{position:fixed;color:#fff;pointer-events:none}
@keyframes fall{from{transform:translateY(-20vh)}to{transform:translateY(85vh)}}
@keyframes sideLeft{from{transform:translateX(-20vw) translateY(20vh)}to{transform:translateX(45vw) translateY(85vh)}}
@keyframes sideRight{from{transform:translateX(120vw) translateY(20vh)}to{transform:translateX(55vw) translateY(85vh)}}
@keyframes fadeIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.letter{display:none;margin-top:15px;animation:fadeIn 1s}
</style>
</head>
<body>

<audio id="lagu" autoplay loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card">
<img src="download.jpg"><img src="download (1).jpg"><img src="download (2).jpg">
<h1>happy valentine babyy ma babyyy 💗</h1>
<p id="awal">pencet tombolnya dulu yaa 😚</p>
<button onclick="bukaSurat()">buka surat 💌</button>
<div class="letter" id="surat">
<p>HAIII BABYYY!! makasih yaa udah bertahan sejauh ini bareng aku. semoga semua yang kita rencanain bisa kita wujudin pelan pelan. aku bangga banget sama kamu 💗</p>
<button onclick="lanjutPesan()">lanjut baca</button>
</div>
<p id="pesan"></p>
</div>

<script>
function bukaSurat(){document.getElementById('surat').style.display='block';document.getElementById('awal').style.display='none';document.getElementById('lagu').play().catch(()=>{});} 
function lanjutPesan(){document.getElementById('pesan').innerHTML='aku sayang kamu hari ini, besok, dan seterusnya. semangat terus yaa cantikkk 😚✨'}

let ground=[];
function createHeart(type){
 let h=document.createElement('div');
 h.className='heart';
 h.innerHTML='❤';
 h.style.fontSize=(Math.random()*14+18)+'px';
 if(type==='top'){h.style.left=Math.random()*100+'vw';h.style.animation='fall 4s linear forwards'}
 if(type==='left'){h.style.animation='sideLeft 5s linear forwards'}
 if(type==='right'){h.style.animation='sideRight 5s linear forwards'}
 document.body.appendChild(h);
 setTimeout(()=>{h.style.position='fixed';h.style.bottom='0';h.style.top='auto';h.style.transform='none';ground.push(h);arrangeGround();},5000);
}
function arrangeGround(){ground.forEach((h,i)=>{h.style.left=(i%20)*5+'vw';h.style.bottom=Math.floor(i/20)*18+'px'})}
setInterval(()=>{createHeart(['top','left','right'][Math.floor(Math.random()*3)])},200);
</script>
</body>
</html>
